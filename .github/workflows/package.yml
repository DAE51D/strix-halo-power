name: Package and Release Plasmoid

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: metadata
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('applet/com.daevid.pmode/metadata.json'))['KPlugin']['Version'])")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "FILENAME=pmode-${VERSION}.plasmoid" >> $GITHUB_OUTPUT

      - name: Package Plasmoid
        run: |
          cd applet/com.daevid.pmode
          zip -r "../../${{ steps.metadata.outputs.FILENAME }}" .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.metadata.outputs.FILENAME }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
